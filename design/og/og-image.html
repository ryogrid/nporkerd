<!doctype html>
<!-- nporkerd Open Graph image source (1200×630). Everything is vector: inline
     SVG for the table, cards and chips, HTML/CSS for the type. Render to
     public/og-image.png with design/og/render.cjs. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>nporkerd OG image</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b1210;
    --text: #eef2ec;
    --text-dim: #c9d4cc;
    --gold: #e3b955;
    --gold-2: #b98a2c;
    --font: "Inter", system-ui, sans-serif;
    --font-display: "Playfair Display", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  .og {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .og svg.art { position: absolute; inset: 0; }
  .copy { position: absolute; left: 64px; top: 58px; width: 560px; }
  .brand {
    display: flex; align-items: center; gap: 22px;
    font-family: var(--font-display); font-weight: 800; font-size: 104px;
    line-height: 1; letter-spacing: .005em; color: var(--text);
    text-shadow: 0 4px 18px rgba(0,0,0,.6);
  }
  .brand em { font-style: normal; color: var(--gold); }
  .brand-mark { width: 96px; height: 96px; flex: none; filter: drop-shadow(0 6px 14px rgba(0,0,0,.55)); }
  .tag {
    margin: 64px 0 0; font-family: var(--font-display); font-weight: 700;
    font-size: 62px; line-height: 1.04; letter-spacing: -.005em;
    text-shadow: 0 3px 14px rgba(0,0,0,.7);
  }
  .tag em { font-style: italic; color: var(--gold); }
  .sub {
    margin: 14px 0 0; font-size: 36px; font-weight: 600; color: var(--text-dim);
    letter-spacing: -.005em; text-shadow: 0 2px 10px rgba(0,0,0,.8);
  }
  .pill {
    position: absolute; left: 64px; bottom: 60px;
    display: inline-flex; align-items: center; gap: 14px;
    padding: 12px 24px; border-radius: 999px;
    font-size: 27px; font-weight: 700; color: var(--text);
    background: rgba(9, 15, 13, .78);
    border: 2px solid rgba(227, 185, 85, .55);
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  .pill i { font-style: normal; color: var(--gold); font-weight: 800; }
</style>
</head>
<body>
<div class="og" id="og">
<svg class="art" width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <radialGradient id="vignette" cx="60%" cy="48%" r="75%">

    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1210" stop-opacity=".92" />
      <stop offset=".36" stop-color="#0b1210" stop-opacity=".7" />
      <stop offset=".55" stop-color="#0b1210" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glint" cx="50%" cy="50%" r="50%">

      <stop offset="1" stop-color="#ffe8a6" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14" /></filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".55" />

    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">

    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- the table -->
  <g id="table">
    <ellipse cx="900" cy="372" rx="452" ry="232" fill="#000" opacity=".55" filter="url(#soft)" />
    <ellipse cx="900" cy="346" rx="444" ry="222" fill="url(#rail)" />
    <ellipse cx="900" cy="340" rx="436" ry="212" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="2" />
    <ellipse cx="900" cy="346" rx="410" ry="196" fill="#b98a2c" />
    <ellipse cx="900" cy="347" rx="405" ry="192" fill="url(#felt)" />
    <ellipse cx="900" cy="347" rx="405" ry="192" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="10" />
    <ellipse cx="900" cy="350" rx="330" ry="146" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="2.5" />
    <text x="900" y="452" text-anchor="middle" font-family="Playfair Display" font-style="italic" font-weight="700" font-size="40" fill="rgba(255,255,255,.07)" letter-spacing="3">nporkerd</text>
  </g>

  <!-- spotlight over the felt -->
  <ellipse cx="880" cy="250" rx="520" ry="330" fill="url(#spot)" />

  <!-- community cards lying on the felt (foreshortened) -->

    <g transform="translate(900 300) scale(1 .66)">

      <use href="#card-Js" x="-129" y="-49" width="70" height="98" transform="rotate(2 -94 0)" />
      <use href="#card-Td" x="-43" y="-49" width="70" height="98" transform="rotate(-1 -8 0)" />
      <use href="#card-back" x="43" y="-49" width="70" height="98" transform="rotate(3 78 0)" />

  <!-- dealer button -->
  <g transform="translate(1140 300)" filter="url(#smallShadow)">
    <ellipse cx="0" cy="6" rx="24" ry="13" fill="#b9b3a4" />
    <ellipse cx="0" cy="0" rx="24" ry="13" fill="#f4efe4" />

    <circle cx="1088" cy="356" r="26" fill="url(#glint)" opacity=".7" />

    <circle cx="868" cy="372" r="20" fill="url(#glint)" opacity=".55" />

<div class="copy">
  <div class="brand">

        <radialGradient id="coin" cx="35%" cy="30%" r="75%">
          <stop offset="0" stop-color="#ffe8a6" />
          <stop offset=".55" stop-color="#e3b955" />
          <stop offset="1" stop-color="#b98a2c" />

      <circle cx="50" cy="50" r="49" fill="rgba(227,185,85,.28)" />

    </svg>
    <span>npork<em>erd</em></span>

  <p class="tag">Texas Hold’em<br /><em>with friends,</em></p>
  <p class="sub">right in your browser</p>
</div>
<div class="pill">Free <i>·</i> No downloads <i>·</i> Play-money chips</div>
</div>

<script>
  // Chip stacks: angled-view poker chips (top ellipse + striped edge), stacked.
  const NS = "http://www.w3.org/2000/svg";
  const COLORS = { red: "#c43a3a", black: "#2a2c31", gold: "#c7952f", blue: "#2f63b8" };
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * f));
    return `rgb(${c.join(",")})`;
  }
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }
  function chip(g, x, y, r, color) {
    const ry = r * 0.52, h = r * 0.24, base = COLORS[color];
    const side = `M${x - r} ${y} A${r} ${ry} 0 0 0 ${x + r} ${y} L${x + r} ${y + h} A${r} ${ry} 0 0 1 ${x - r} ${y + h} Z`;
    el("path", { d: side, fill: shade(base, 0.62) }, g);
    // edge stripes
    const arc = `M${x - r} ${y + h / 2} A${r} ${ry} 0 0 0 ${x + r} ${y + h / 2}`;
    el("path", { d: arc, fill: "none", stroke: "#f4efe4", "stroke-width": h * 0.9, "stroke-dasharray": `${r * 0.22} ${r * 0.5}`, opacity: 0.85 }, g);
    el("ellipse", { cx: x, cy: y, rx: r, ry, fill: base }, g);
    el("ellipse", { cx: x, cy: y, rx: r * 0.84, ry: ry * 0.84, fill: "none", stroke: "#f4efe4", "stroke-width": r * 0.2, "stroke-dasharray": `${r * 0.26} ${r * 0.42}` }, g);
    el("ellipse", { cx: x, cy: y, rx: r * 0.6, ry: ry * 0.6, fill: shade(base, 0.92), stroke: "rgba(255,255,255,.55)", "stroke-width": 1.2, "stroke-dasharray": "3 3" }, g);
    el("ellipse", { cx: x - r * 0.25, cy: y - ry * 0.35, rx: r * 0.35, ry: ry * 0.22, fill: "rgba(255,255,255,.16)" }, g);
  }
  function stack(x, y, r, colors) {
    const g = el("g", { filter: "url(#smallShadow)" }, document.getElementById("chips"));
    const h = r * 0.24;
    colors.forEach((c, i) => chip(g, x, y - i * h, r, c));
  }
  const rep = (c, n) => Array(n).fill(c);
  // pot in the middle of the felt
  stack(760, 410, 24, rep("red", 5));
  stack(806, 424, 24, rep("black", 7));
  stack(784, 446, 24, rep("gold", 3));
  // opponents' stacks across the table
  stack(640, 300, 19, rep("blue", 6));
  stack(672, 312, 19, rep("red", 4));
  stack(1000, 196, 17, rep("gold", 5));
  stack(1030, 204, 17, rep("black", 3));
  stack(780, 196, 17, rep("red", 4));
  // the hero's stacks, right of the hole cards
  stack(1116, 452, 26, rep("black", 8));
  stack(1088, 506, 26, rep("blue", 5));
  stack(1140, 512, 26, rep("gold", 3));
</script>
